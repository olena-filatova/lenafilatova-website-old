<meta name="robots" content="noindex">
<script>
  // SPA redirect for GitHub Pages: turn /some/path into /?/some/path so index.html can restore it.
  (function () {
    var l = window.location;
    var seg = 0; // custom domain served at root
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  }());
</script>
